name: Update GitHub Activity Graph

on:
  push:
    branches:
      - main
  schedule:
    - cron: "17 */12 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-activity-graph
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout profile repository
        uses: actions/checkout@v6

      - name: Generate activity graph
        uses: maurodesouza/github-readme-activity-graph-action@v1
        with:
          username: ${{ github.repository_owner }}
          token: ${{ github.token }}
          output_path: profile/activity-graph.svg
          options: >-
            theme=github
            &hide_border=true
            &area=true
            &custom_title=GitHub%20Activity
            &height=320

      - name: Publish generated graph
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/activity-graph.svg
          git diff --cached --quiet && exit 0
          git commit -m "Update GitHub activity graph"
          git push
